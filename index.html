<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

@font-face {
  font-family: 'Blade Runner Movie';
  src: url('/fonts/blade-runner-movie.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

:root {
  --bg:         #06050a;
  --warm:       #ddd5c2;
  --warm-dim:   #6b6055;
  --warm-faint: #28231d;
  --groove:     #c4aa7e;
  --needle:     #ede4d0;
  --copper:     #c97a3a;
  --font-hero:  'Blade Runner Movie', ui-monospace, monospace;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
html, body {
  width:100%; height:100%; overflow:hidden;
  background: var(--bg);
  color: var(--warm);
  cursor: none;
  touch-action: none;
}

canvas { touch-action: none; }
.shell a, .shell button, .nav-link { touch-action: manipulation; }

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 10000;
  background: var(--needle);
  color: var(--bg);
  padding: 0.5em 1em;
  font-family: var(--font-hero);
  text-decoration: none;
}
.skip-link:focus { left: 0; }

canvas {
  position:fixed; inset:0; z-index:0; display:block;
  pointer-events:none;
}

.cur-dot {
  position:fixed; width:6px; height:6px;
  background: var(--needle);
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none; z-index:9999;
  mix-blend-mode:screen;
}
.cur-ring {
  position:fixed; width:34px; height:34px;
  border:1px solid rgba(196,170,126,0.35);
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none; z-index:9998;
  transition: width .2s ease, height .2s ease, border-color .2s ease;
}
.cur-ring.big { width:58px; height:58px; border-color:rgba(201,122,58,0.25); }

.vignette {
  position:fixed; inset:0; z-index:3; pointer-events:none;
  background: radial-gradient(ellipse 75% 75% at 50% 50%,
    transparent 28%, rgba(6,5,10,0.72) 100%);
}
.scanlines {
  position:fixed; inset:0; z-index:4; pointer-events:none;
  background: repeating-linear-gradient(
    to bottom, transparent, transparent 2px,
    rgba(0,0,0,0.035) 2px, rgba(0,0,0,0.035) 3px
  );
}
.grain {
  position:fixed; z-index:5; pointer-events:none;
  inset:-150%; width:400%; height:400%;
  opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  animation: grain .45s steps(1) infinite;
}
@keyframes grain {
  0%   { transform:translate(0,0); }
  20%  { transform:translate(-3%,-5%); }
  40%  { transform:translate(5%, 2%); }
  60%  { transform:translate(-2%, 6%); }
  80%  { transform:translate(4%,-3%); }
  100% { transform:translate(0,0); }
}

.shell {
  position:fixed; inset:0; z-index:10;
  display:grid;
  grid-template-columns: 1fr auto 1fr;
  grid-template-rows:    1fr auto 1fr;
  padding: clamp(24px,5vh,56px) clamp(28px,5vw,72px);
  pointer-events:none;
  animation: rise 1.1s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rise {
  from { transform:translateY(10px); }
  to   { transform:translateY(0); }
}

.corner-bl { grid-column:1; grid-row:3; align-self:end; justify-self:start; z-index:12; }
.corner-br { grid-column:3; grid-row:3; align-self:end; justify-self:end; text-align:right; z-index:12; }
.center    { grid-column:2; grid-row:2; align-self:center; justify-self:center; text-align:center; }

.nav {
  display:flex; flex-direction:column; gap:10px;
  pointer-events:all;
}
.corner-br .nav { align-items:flex-end; }

.nav-link {
  font-family: var(--font-hero);
  font-weight: normal;
  font-size: clamp(14px, 2.8vw, 22px);
  letter-spacing: .1em;
  color: var(--warm-dim);
  text-decoration: none;
  position: relative;
  padding-bottom: 9px;
  transition: color .2s;
}
.nav-link::after {
  content:'';
  position:absolute; bottom:0; left:0;
  height:1px; width:0;
  background: var(--groove);
  transition: width .5s cubic-bezier(.22,1,.36,1);
}
.corner-br .nav-link::after { left:auto; right:0; }
.nav-link:hover { color: var(--needle); }
.nav-link:hover::after { width:100%; }

.title-wrap {
  position: relative;
  display: inline-block;
}

.title-wrap::before {
  content: '';
  position: absolute;
  inset: -12% -8%;
  background: radial-gradient(ellipse at 50% 50%,
    rgba(237, 228, 208, 0.22) 0%,
    rgba(201, 122, 58, 0.08) 42%,
    transparent 72%);
  opacity: 0;
  pointer-events: none;
  mix-blend-mode: screen;
}

.title-wrap.is-flashing::before {
  animation: title-bloom 0.18s steps(3) 1;
}

.title {
  font-family: var(--font-hero);
  font-weight: normal;
  font-size: clamp(48px, 12vw, 140px);
  line-height: .95;
  letter-spacing: .06em;
  color: var(--warm);
  user-select: none;
  position: relative;
  display: inline-block;
  contain: layout style;
  animation: title-idle 4.2s infinite step-end;
}

.title::before, .title::after {
  content:attr(data-text);
  position:absolute; inset:0; pointer-events:none;
  font-family:inherit;
  font-weight:inherit;
  letter-spacing:inherit;
  line-height:inherit;
}

.title::before {
  color:var(--copper);
  animation: g1 4.5s infinite step-start;
  clip-path:polygon(0 0,0 0,0 0,0 0);
}

.title::after {
  color:var(--needle);
  animation: g2 3.8s infinite step-start;
  clip-path:polygon(0 0,0 0,0 0,0 0);
  mix-blend-mode: screen;
  opacity: .55;
}

.title.is-glitching {
  animation: title-hit 0.22s steps(5) 1;
}

.title.is-glitching::before {
  animation: g1-burst 0.24s steps(6) 1;
}

.title.is-glitching::after {
  animation: g2-burst 0.24s steps(5) 1;
}

@keyframes title-idle {
  0%, 94%, 100% { opacity: 1; transform: translate(0); filter: none; }
  95% { opacity: .78; transform: translate(-1px, 0); filter: brightness(1.35); }
  96% { opacity: 1; transform: translate(2px, -1px); text-shadow: -3px 0 rgba(201,122,58,.55), 3px 0 rgba(237,228,208,.35); }
  97% { opacity: .9; transform: translate(-2px, 1px); }
  98% { opacity: 1; transform: translate(0); text-shadow: none; }
}

@keyframes title-hit {
  0%   { transform: translate(0); filter: brightness(1); }
  20%  { transform: translate(-3px, 1px) skewX(-2deg); filter: brightness(1.65); color: var(--needle); }
  40%  { transform: translate(4px, -2px) skewX(1.5deg); filter: brightness(1.2); }
  60%  { transform: translate(-2px, 0); filter: brightness(1.9); color: var(--warm); }
  80%  { transform: translate(2px, 1px); filter: brightness(1.1); }
  100% { transform: translate(0); filter: brightness(1); }
}

@keyframes title-bloom {
  0%, 100% { opacity: 0; }
  35%      { opacity: .95; }
  70%      { opacity: .35; }
}

@keyframes g1 {
  0%, 68%, 100% { clip-path:polygon(0 0,0 0,0 0,0 0); transform:translate(0); opacity:0; }
  69% { clip-path:polygon(0 6%,100% 6%,100% 16%,0 16%); transform:translate(-7px,2px); opacity:.95; }
  70% { clip-path:polygon(0 28%,100% 28%,100% 40%,0 40%); transform:translate(5px,-2px); opacity:.75; }
  71% { clip-path:polygon(0 52%,100% 52%,100% 64%,0 64%); transform:translate(-4px,1px); opacity:.9; }
  72% { clip-path:polygon(0 78%,100% 78%,100% 88%,0 88%); transform:translate(6px,0); opacity:.65; }
  73% { clip-path:polygon(0 0,0 0,0 0,0 0); opacity:0; }
  84% { clip-path:polygon(0 18%,100% 18%,100% 30%,0 30%); transform:translate(-5px,-1px); opacity:.85; }
  85% { clip-path:polygon(0 44%,100% 44%,100% 56%,0 56%); transform:translate(4px,2px); opacity:.7; }
  86% { clip-path:polygon(0 0,0 0,0 0,0 0); opacity:0; }
  92% { clip-path:polygon(0 62%,100% 62%,100% 74%,0 74%); transform:translate(-6px,1px); opacity:.8; }
  93% { clip-path:polygon(0 0,0 0,0 0,0 0); opacity:0; }
}

@keyframes g2 {
  0%, 72%, 100% { clip-path:polygon(0 0,0 0,0 0,0 0); transform:translate(0); opacity:0; }
  73% { clip-path:polygon(0 12%,100% 12%,100% 24%,0 24%); transform:translate(6px,-1px); opacity:.7; }
  74% { clip-path:polygon(0 36%,100% 36%,100% 48%,0 48%); transform:translate(-5px,2px); opacity:.55; }
  75% { clip-path:polygon(0 66%,100% 66%,100% 78%,0 78%); transform:translate(4px,0); opacity:.65; }
  76% { clip-path:polygon(0 0,0 0,0 0,0 0); opacity:0; }
  88% { clip-path:polygon(0 22%,100% 22%,100% 34%,0 34%); transform:translate(-4px,1px); opacity:.6; }
  89% { clip-path:polygon(0 58%,100% 58%,100% 70%,0 70%); transform:translate(5px,-2px); opacity:.5; }
  90% { clip-path:polygon(0 0,0 0,0 0,0 0); opacity:0; }
}

@keyframes g1-burst {
  0%   { clip-path:polygon(0 0,0 0,0 0,0 0); transform:translate(0); opacity:0; }
  15%  { clip-path:polygon(0 10%,100% 10%,100% 22%,0 22%); transform:translate(-9px,2px); opacity:1; }
  35%  { clip-path:polygon(0 38%,100% 38%,100% 50%,0 50%); transform:translate(7px,-3px); opacity:.85; }
  55%  { clip-path:polygon(0 64%,100% 64%,100% 76%,0 76%); transform:translate(-6px,1px); opacity:.95; }
  75%  { clip-path:polygon(0 82%,100% 82%,100% 94%,0 94%); transform:translate(5px,0); opacity:.7; }
  100% { clip-path:polygon(0 0,0 0,0 0,0 0); opacity:0; }
}

@keyframes g2-burst {
  0%   { clip-path:polygon(0 0,0 0,0 0,0 0); transform:translate(0); opacity:0; }
  20%  { clip-path:polygon(0 16%,100% 16%,100% 28%,0 28%); transform:translate(8px,-2px); opacity:.75; }
  45%  { clip-path:polygon(0 42%,100% 42%,100% 54%,0 54%); transform:translate(-7px,2px); opacity:.65; }
  70%  { clip-path:polygon(0 70%,100% 70%,100% 82%,0 82%); transform:translate(6px,-1px); opacity:.8; }

}

<script>
/** Full visuals; canvas starts after first paint for LCP */
(function () {
  'use strict';
  function boot() {
// ── Cursor ────────────────────────────────────────────────────────
const cDot  = document.getElementById('cDot');
const cRing = document.getElementById('cRing');
let mx = innerWidth/2, my = innerHeight/2;
let rx = mx, ry = my;

function setPointer(x, y) {
  mx = x; my = y;
}
document.addEventListener('mousemove', e => setPointer(e.clientX, e.clientY));
document.addEventListener('touchmove', e => {
  if (e.touches[0]) setPointer(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
document.querySelectorAll('a').forEach(a => {
  a.addEventListener('mouseenter', () => cRing.classList.add('big'));
  a.addEventListener('mouseleave', () => cRing.classList.remove('big'));
});
const titleWrap = document.getElementById('title-wrap');
const heroTitle = document.getElementById('lcp-title');
let titleRect = null;
let overTitle = false;
let titleFlashReady = 0;

function updateTitleRect() {
  if (!titleWrap) return;
  titleRect = titleWrap.getBoundingClientRect();
}

function triggerTitleGlitch() {
  if (!heroTitle || !titleWrap || performance.now() < titleFlashReady) return;
  titleFlashReady = performance.now() + 320 + Math.random() * 900;
  titleWrap.classList.remove('is-flashing');
  heroTitle.classList.remove('is-glitching');
  void titleWrap.offsetWidth;
  titleWrap.classList.add('is-flashing');
  heroTitle.classList.add('is-glitching');
  window.setTimeout(() => titleWrap.classList.remove('is-flashing'), 180);
  window.setTimeout(() => heroTitle.classList.remove('is-glitching'), 240);
}

function checkTitleHover(x, y) {
  if (!titleRect) return;
  const pad = 28;
  const hit =
    x >= titleRect.left - pad &&
    x <= titleRect.right + pad &&
    y >= titleRect.top - pad &&
    y <= titleRect.bottom + pad;

  if (hit && !overTitle) {
    overTitle = true;
    triggerTitleGlitch();
  } else if (!hit) {
    overTitle = false;
  } else if (hit && Math.random() < 0.012) {
    triggerTitleGlitch();
  }
}

updateTitleRect();
window.addEventListener('resize', updateTitleRect);

(function animCursor() {
  rx += (mx - rx) * 0.11; ry += (my - ry) * 0.11;
  cDot.style.left  = mx + 'px'; cDot.style.top  = my + 'px';
  cRing.style.left = rx + 'px'; cRing.style.top = ry + 'px';
  checkTitleHover(mx, my);
  requestAnimationFrame(animCursor);
})();

// ── Canvas ────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize(); window.addEventListener('resize', () => { resize(); initGrooves(); });

let mouseX = W/2, mouseY = H/2;
function setMouse(x, y) { mouseX = x; mouseY = y; }
document.addEventListener('mousemove', e => setMouse(e.clientX, e.clientY));
document.addEventListener('touchmove', e => {
  if (e.touches[0]) setMouse(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });

// ── Colour helpers ────────────────────────────────────────────────
const C = {
  groove: [196,170,126],
  needle: [237,228,208],
  copper: [201,122, 58],
  ember:  [180, 90, 30],
  dark:   [ 30, 24, 18],
};
const rgba = (c,a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ── 1. GROOVE RINGS (v2 DNA) — but denser, more prominent ─────────
const RINGS = window.innerWidth < 768 ? 50 : 90;
let grooves = [];
function initGrooves() {
  grooves = Array.from({length:RINGS}, (_,i) => ({
    i,
    phase:  (i/RINGS) * Math.PI * 2 + Math.random() * 0.4,
    wobble: (Math.random()-.5) * 0.004,
    thick:  i % 9 === 0 ? 1.1 : (i % 3 === 0 ? 0.6 : 0.3),
    opacity: 0.025 + (i/RINGS) * 0.055,   // outer rings brighter = more prominent
  }));
}
initGrooves();

function drawGrooves(t) {
  const cx = W/2, cy = H/2;
  const maxR = Math.min(W,H) * 0.47;
  const minR = Math.min(W,H) * 0.03;
  const mdx  = (mouseX - cx) / W;
  const mdy  = (mouseY - cy) / H;

  grooves.forEach(g => {
    const base = minR + (maxR - minR) * (g.i / RINGS);
    const r    = base + Math.sin(t * 0.28 + g.phase) * base * 0.012;
    // eccentricity: mouse warps the rings like a poorly-centred pressing
    const ex   = cx + mdx * (g.i/RINGS) * 28;
    const ey   = cy + mdy * (g.i/RINGS) * 20;

    ctx.beginPath();
    for (let s = 0; s <= 160; s++) {
      const a = (s/160) * Math.PI * 2;
      const px = ex + Math.cos(a) * r;
      const py = ey + Math.sin(a) * r;
      s === 0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
    }
    ctx.closePath();

    // Highlighted ring nearest cursor
    const dToCenter = Math.hypot(mouseX - cx, mouseY - cy);
    const nearThis  = Math.abs(dToCenter - r) < 14;
    ctx.strokeStyle = nearThis
      ? rgba(C.copper, g.opacity * 4.5)
      : rgba(C.groove, g.opacity);
    ctx.lineWidth   = nearThis ? g.thick * 2.2 : g.thick;
    ctx.stroke();
  });

  // Spindle
  ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, Math.PI*2);
  ctx.fillStyle = rgba(C.groove, 0.4); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, 1.4, 0, Math.PI*2);
  ctx.fillStyle = rgba(C.needle, 0.75); ctx.fill();
}

// ── 2. LISSAJOUS ATTRACTORS (v1 DNA) — warm copper palette ────────
class Attractor {
  constructor(a, b, d, scale, speed) {
    Object.assign(this, {a,b,d,scale,speed});
    this.t     = Math.random() * Math.PI * 2;
    this.cx    = 0.38 + Math.random() * 0.24;
    this.cy    = 0.38 + Math.random() * 0.24;
    this.alpha = 0.028 + Math.random() * 0.032;
    this.col   = Math.random() < 0.5 ? C.copper : C.groove;
  }
  draw(t) {
    const ox = this.cx * W, oy = this.cy * H;
    const steps = 380;
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const u = (i/steps) * Math.PI * 2;
      const x = ox + Math.sin(this.a * u + this.d + t * this.speed * 0.18) * this.scale;
      const y = oy + Math.sin(this.b * u                                  ) * this.scale * 0.62;
      i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.strokeStyle = rgba(this.col, this.alpha);
    ctx.lineWidth   = 0.55;
    ctx.stroke();
  }
}

const attractors = [
  new Attractor(3, 2, 1.5,  Math.min(W,H)*0.26, 0.6),
  new Attractor(5, 4, 0.9,  Math.min(W,H)*0.19, 0.45),
  new Attractor(2, 3, 0.35, Math.min(W,H)*0.31, 0.8),
  new Attractor(7, 6, 1.1,  Math.min(W,H)*0.14, 0.55),
];

// ── 3. PARTICLES (v1 DNA) — re-coloured warm ──────────────────────
const PCOUNT = window.innerWidth < 768 ? 120 : 240;
const parts  = [];

function mkParticle() {
  const angle = Math.random() * Math.PI * 2;
  const orb   = 60 + Math.random() * Math.min(W,H) * 0.48;
  const isCopper = Math.random() < 0.1;
  return {
    x:orb*Math.cos(angle)+W/2, y:orb*Math.sin(angle)+H/2,
    vx:0, vy:0,
    angle, orb,
    drift:  (Math.random()-.5) * 0.0018,
    speed:  Math.random() * 0.35 + 0.08,
    size:   Math.random() * 1.1 + 0.3,
    alpha:  Math.random() * 0.45 + 0.12,
    col:    isCopper ? C.copper : (Math.random()<0.2 ? C.needle : C.groove),
  };
}
for (let i = 0; i < PCOUNT; i++) parts.push(mkParticle());

function drawParticles(t) {
  const cx = W/2, cy = H/2;
  parts.forEach(p => {
    p.angle += p.drift + p.speed * 0.003;
    p.orb   += Math.sin(t + p.angle) * 0.14;
    const tx = cx + Math.cos(p.angle) * p.orb;
    const ty = cy + Math.sin(p.angle) * p.orb;
    const dM = Math.hypot(mouseX - tx, mouseY - ty);
    const rep = Math.max(0, 150 - dM) / 150;
    const fx  = (tx - mouseX) / (dM||1) * rep * 70;
    const fy  = (ty - mouseY) / (dM||1) * rep * 70;
    p.vx += ((tx+fx) - p.x) * 0.045; p.vy += ((ty+fy) - p.y) * 0.045;
    p.vx *= 0.87; p.vy *= 0.87;
    p.x  += p.vx;  p.y  += p.vy;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fillStyle = rgba(p.col, p.alpha);
    ctx.fill();
  });

  // Connection threads — thinner, warmer
  ctx.lineWidth = 0.25;
  for (let i = 0; i < parts.length; i++) {
    for (let j = i+1; j < parts.length; j++) {
      const dx = parts[i].x - parts[j].x;
      const dy = parts[i].y - parts[j].y;
      const d  = Math.sqrt(dx*dx + dy*dy);
      if (d < 80) {
        ctx.strokeStyle = rgba(C.groove, (1-d/80) * 0.1);
        ctx.beginPath();
        ctx.moveTo(parts[i].x, parts[i].y);
        ctx.lineTo(parts[j].x, parts[j].y);
        ctx.stroke();
      }
    }
  }
}

// ── 4. NEEDLE GLOW at cursor ──────────────────────────────────────
function drawGlow() {
  const g = ctx.createRadialGradient(mouseX,mouseY,0, mouseX,mouseY,80);
  g.addColorStop(0,   rgba(C.needle, 0.1));
  g.addColorStop(0.4, rgba(C.copper, 0.04));
  g.addColorStop(1,   rgba(C.groove, 0));
  ctx.beginPath(); ctx.arc(mouseX, mouseY, 80, 0, Math.PI*2);
  ctx.fillStyle = g; ctx.fill();
}

// ── Slow Archimedean spiral ghost (tonearm trace) ─────────────────
function drawSpiralGhost(t) {
  const cx = W/2, cy = H/2;
  const maxR = Math.min(W,H) * 0.47;
  ctx.beginPath();
  for (let s = 0; s <= 700; s++) {
    const frac  = s/700;
    const theta = frac * 7 * Math.PI * 2 + t * 0.04;
    const r     = frac * maxR;
    const x     = cx + Math.cos(theta) * r;
    const y     = cy + Math.sin(theta) * r;
    s === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.strokeStyle = rgba(C.ember, 0.018);
  ctx.lineWidth   = 0.5;
  ctx.stroke();
}

// ── Render ────────────────────────────────────────────────────────
let t = 0;
function frame() {
  if (!canvas.isConnected) return;
  t += 0.009;
  ctx.fillStyle = 'rgba(6,5,10,0.2)';
  ctx.fillRect(0, 0, W, H);

  drawSpiralGhost(t);
  drawGrooves(t);
  attractors.forEach(a => a.draw(t));
  drawParticles(t);
  drawGlow();

  requestAnimationFrame(frame);
}
frame();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', schedule, { once: true });
  } else schedule();
  function schedule() {
    requestAnimationFrame(() => requestAnimationFrame(boot));
  }
})();
</script>
