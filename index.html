<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Prisss — Selector. Live sets. Performer. Techno & infinite groove.">
<title>Prisss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@100;300;400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #050508;
    --fg: #e8e4dc;
    --fg-dim: #5a5650;
    --accent: #c8ff00;
    --accent2: #ff3a1a;
    --font-mono: 'Share Tech Mono', monospace;
    --font-cond: 'Barlow Condensed', sans-serif;
  }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-cond);
    cursor: none;
  }

  canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
  }

  /* custom cursor */
  .cursor {
    position: fixed;
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 9999;
    mix-blend-mode: exclusion;
    transition: transform 0.1s ease;
  }
  .cursor-ring {
    position: fixed;
    width: 36px; height: 36px;
    border: 1px solid rgba(200,255,0,0.4);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 9998;
    transition: transform 0.18s ease, width 0.2s ease, height 0.2s ease;
  }
  .cursor-ring.expanded {
    width: 60px; height: 60px;
    border-color: rgba(200,255,0,0.2);
  }

  /* overlay layout */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    grid-template-rows: 1fr auto 1fr;
    padding: 5vh 6vw;
    pointer-events: none;
  }

  /* top bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .badge {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--fg-dim);
    text-transform: uppercase;
    line-height: 1.6;
  }
  .badge span {
    display: block;
  }
  .badge .live {
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge .live::before {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: blink 1.8s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  /* center title */
  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    text-align: center;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: clamp(9px, 1.1vw, 12px);
    letter-spacing: 0.35em;
    color: var(--fg-dim);
    text-transform: uppercase;
    margin-bottom: 1.2rem;
  }

  .title {
    font-family: var(--font-cond);
    font-weight: 900;
    font-size: clamp(100px, 22vw, 240px);
    line-height: 0.82;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    color: var(--fg);
    position: relative;
    user-select: none;
  }

  /* glitch layers */
  .title::before,
  .title::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    background: transparent;
  }
  .title::before {
    color: var(--accent2);
    clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%);
    animation: glitch-1 4.5s infinite step-start;
    transform: translateX(-3px);
  }
  .title::after {
    color: var(--accent);
    clip-path: polygon(0 60%, 100% 60%, 100% 75%, 0 75%);
    animation: glitch-2 4.5s infinite step-start;
    transform: translateX(3px);
  }

  @keyframes glitch-1 {
    0%, 90%, 100% { transform: translateX(0); opacity: 0; clip-path: polygon(0 0, 0 0, 0 0, 0 0); }
    91% { transform: translateX(-5px); opacity: 1; clip-path: polygon(0 18%, 100% 18%, 100% 38%, 0 38%); }
    92% { transform: translateX(3px); opacity: 1; clip-path: polygon(0 50%, 100% 50%, 100% 60%, 0 60%); }
    93% { transform: translateX(-3px); opacity: 0.7; clip-path: polygon(0 5%, 100% 5%, 100% 22%, 0 22%); }
    94%, 100% { opacity: 0; clip-path: polygon(0 0, 0 0, 0 0, 0 0); }
  }
  @keyframes glitch-2 {
    0%, 92%, 100% { transform: translateX(0); opacity: 0; clip-path: polygon(0 0, 0 0, 0 0, 0 0); }
    93% { transform: translateX(6px); opacity: 1; clip-path: polygon(0 62%, 100% 62%, 100% 80%, 0 80%); }
    94% { transform: translateX(-4px); opacity: 1; clip-path: polygon(0 30%, 100% 30%, 100% 45%, 0 45%); }
    95%, 100% { opacity: 0; clip-path: polygon(0 0, 0 0, 0 0, 0 0); }
  }

  .tagline {
    font-family: var(--font-cond);
    font-weight: 100;
    font-size: clamp(13px, 1.8vw, 20px);
    letter-spacing: 0.55em;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin-top: 2rem;
  }

  /* bottom links */
  .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .links {
    display: flex;
    gap: 3rem;
    pointer-events: all;
  }

  .link-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-decoration: none;
    position: relative;
    overflow: hidden;
  }
  .link-item::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 0; height: 1px;
    background: var(--accent);
    transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .link-item:hover::after { width: 100%; }
  .link-item:hover .link-label { color: var(--fg); }
  .link-item:hover .link-platform { color: var(--accent); }

  .link-platform {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--fg-dim);
    text-transform: uppercase;
    transition: color 0.2s;
    padding-bottom: 6px;
  }
  .link-label {
    font-family: var(--font-cond);
    font-weight: 700;
    font-size: clamp(14px, 1.8vw, 20px);
    letter-spacing: 0.08em;
    color: rgba(232,228,220,0.55);
    text-transform: uppercase;
    transition: color 0.2s;
  }

  .info-right {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.18em;
    color: var(--fg-dim);
    text-align: right;
    line-height: 2;
    text-transform: uppercase;
  }

  /* scanlines */
  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 5;
    background: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 3px,
      rgba(0,0,0,0.03) 3px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
  }

  /* vignette */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 4;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(5,5,8,0.75) 100%);
    pointer-events: none;
  }

  /* noise grain */
  .grain {
    position: fixed;
    inset: -200%;
    z-index: 6;
    width: 400%; height: 400%;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    pointer-events: none;
    animation: grain-shift 0.5s steps(1) infinite;
  }
  @keyframes grain-shift {
    0%   { transform: translate(0, 0); }
    10%  { transform: translate(-3%, -5%); }
    20%  { transform: translate(-6%, 2%); }
    30%  { transform: translate(4%, -3%); }
    40%  { transform: translate(2%, 6%); }
    50%  { transform: translate(-5%, 1%); }
    60%  { transform: translate(3%, -4%); }
    70%  { transform: translate(-2%, 5%); }
    80%  { transform: translate(5%, -2%); }
    90%  { transform: translate(-4%, 3%); }
    100% { transform: translate(0, 0); }
  }

  /* intro fade */
  .overlay { animation: fadeIn 2s ease forwards; }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>
<div class="grain"></div>
<div class="cursor" id="cur"></div>
<div class="cursor-ring" id="curRing"></div>

<div class="overlay">
  <div class="top-bar">
    <div class="badge">
      <span class="live">Online</span>
      <span style="margin-top:4px">Techno &bull; Electronics</span>
      <span>Barcelona / ESP</span>
    </div>
    <div class="badge" style="text-align:right">
      <span>Est. 2019</span>
      <span style="margin-top:4px">Infinite Pattern</span>
    </div>
  </div>

  <div class="center">
    <div class="eyebrow">Selector &bull; Live Sets &bull; Performer</div>
    <h1 class="title" data-text="Prisss">Prisss</h1>
    <p class="tagline">Patterns inside groove</p>
  </div>

  <div class="bottom-bar">
    <nav class="links" aria-label="Platforms">
      <a href="https://hearthis.at/prisss/" target="_blank" rel="noopener noreferrer" class="link-item">
        <span class="link-platform">Hearthis.at</span>
        <span class="link-label">Listen</span>
      </a>
      <a href="https://mixcloud.com/prisss" target="_blank" rel="noopener noreferrer" class="link-item">
        <span class="link-platform">Mixcloud</span>
        <span class="link-label">Mixes</span>
      </a>
    </nav>
    <div class="info-right">
      <span style="display:block">Move to interact</span>
      <span style="display:block;margin-top:2px;color:#2a2a2a">© 2025 Prisss</span>
    </div>
  </div>
</div>

<script>
// ─── Custom cursor ───────────────────────────────────────────────────────────
const cur = document.getElementById('cur');
const curRing = document.getElementById('curRing');
let mx = window.innerWidth / 2, my = window.innerHeight / 2;
let rx = mx, ry = my;

document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cur.style.left = mx + 'px';
  cur.style.top  = my + 'px';
});
document.querySelectorAll('a').forEach(a => {
  a.addEventListener('mouseenter', () => curRing.classList.add('expanded'));
  a.addEventListener('mouseleave', () => curRing.classList.remove('expanded'));
});
(function animCursor() {
  rx += (mx - rx) * 0.12;
  ry += (my - ry) * 0.12;
  curRing.style.left = rx + 'px';
  curRing.style.top  = ry + 'px';
  requestAnimationFrame(animCursor);
})();

// ─── Canvas fractal / particle field ─────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Mouse influence
let mouseX = W / 2, mouseY = H / 2;
document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

// ─── Particle system ─────────────────────────────────────────────────────────
const PARTICLE_COUNT = 260;
const particles = [];

function randomParticle(i) {
  const angle = Math.random() * Math.PI * 2;
  const radius = Math.random() * Math.max(W, H) * 0.55 + 60;
  return {
    x: W / 2 + Math.cos(angle) * radius,
    y: H / 2 + Math.sin(angle) * radius,
    ox: 0, oy: 0, // set in update
    vx: 0, vy: 0,
    size: Math.random() * 1.2 + 0.3,
    speed: Math.random() * 0.4 + 0.08,
    angle: angle,
    orbitR: radius,
    drift: (Math.random() - 0.5) * 0.002,
    opacity: Math.random() * 0.5 + 0.15,
    color: Math.random() < 0.06 ? '#c8ff00' : (Math.random() < 0.04 ? '#ff3a1a' : '#e8e4dc'),
  };
}

for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(randomParticle(i));

// ─── Lissajous / attractor lines ─────────────────────────────────────────────
class Attractor {
  constructor(a, b, d, scale, speed) {
    this.a = a; this.b = b; this.d = d;
    this.scale = scale; this.speed = speed;
    this.t = Math.random() * Math.PI * 2;
    this.opacity = 0;
    this.targetOpacity = Math.random() * 0.08 + 0.02;
    this.points = [];
    this.steps = 340;
    this.cx = Math.random() * 0.4 + 0.3; // x center fraction
    this.cy = Math.random() * 0.4 + 0.3;
  }

  update() {
    this.t += this.speed * 0.004;
    this.opacity += (this.targetOpacity - this.opacity) * 0.02;
    this.points = [];
    for (let i = 0; i <= this.steps; i++) {
      const u = (i / this.steps) * Math.PI * 2;
      const x = this.cx * W + Math.sin(this.a * u + this.d) * this.scale;
      const y = this.cy * H + Math.sin(this.b * u) * this.scale * 0.65;
      this.points.push([x, y]);
    }
  }

  draw() {
    if (this.points.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(this.points[0][0], this.points[0][1]);
    for (let i = 1; i < this.points.length; i++) {
      ctx.lineTo(this.points[i][0], this.points[i][1]);
    }
    ctx.strokeStyle = `rgba(200,255,0,${this.opacity})`;
    ctx.lineWidth = 0.4;
    ctx.stroke();
  }
}

const attractors = [
  new Attractor(3, 2, 1.5, Math.min(W, H) * 0.28, 0.7),
  new Attractor(5, 4, 0.8, Math.min(W, H) * 0.2,  0.5),
  new Attractor(2, 3, 0.3, Math.min(W, H) * 0.32, 0.9),
];

// ─── Grid lines ──────────────────────────────────────────────────────────────
function drawGrid(t) {
  const spacing = 80;
  const fade = 0.025;
  ctx.strokeStyle = `rgba(90,86,80,${fade})`;
  ctx.lineWidth = 0.5;

  const cols = Math.ceil(W / spacing) + 1;
  const rows = Math.ceil(H / spacing) + 1;
  const offX = (t * 12) % spacing;
  const offY = (t * 8) % spacing;

  ctx.beginPath();
  for (let x = -offX; x < W + spacing; x += spacing) {
    ctx.moveTo(x, 0); ctx.lineTo(x, H);
  }
  for (let y = -offY; y < H + spacing; y += spacing) {
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  ctx.stroke();
}

// ─── Fractal / recursive rings ────────────────────────────────────────────────
function drawRings(t) {
  const cx = W / 2, cy = H / 2;
  const mx_norm = (mouseX / W - 0.5);
  const my_norm = (mouseY / H - 0.5);

  for (let i = 1; i <= 7; i++) {
    const r = (Math.min(W, H) * 0.08) * i + Math.sin(t * 0.4 + i * 0.7) * 18;
    const ox = mx_norm * i * 14;
    const oy = my_norm * i * 10;
    const alpha = (8 - i) / 8 * 0.06;

    ctx.beginPath();
    ctx.arc(cx + ox, cy + oy, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(200,255,0,${alpha})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }
}

// ─── Animation loop ───────────────────────────────────────────────────────────
let t = 0;
function draw() {
  t += 0.012;

  // faded trail
  ctx.fillStyle = 'rgba(5,5,8,0.22)';
  ctx.fillRect(0, 0, W, H);

  drawGrid(t);
  drawRings(t);

  // Update and draw attractors
  attractors.forEach(a => { a.update(); a.draw(); });

  // Update and draw particles
  const cx = W / 2, cy = H / 2;
  const mdx = (mouseX - cx) / W;
  const mdy = (mouseY - cy) / H;

  particles.forEach(p => {
    p.angle += p.drift + p.speed * 0.003;
    p.orbitR += Math.sin(t + p.angle) * 0.15;

    const tx = cx + Math.cos(p.angle) * p.orbitR;
    const ty = cy + Math.sin(p.angle) * p.orbitR;

    // mouse repulsion
    const distToMouse = Math.hypot(mouseX - tx, mouseY - ty);
    const repulse = Math.max(0, 160 - distToMouse) / 160;
    const rx = (tx - mouseX) / (distToMouse || 1) * repulse * 80;
    const ry = (ty - mouseY) / (distToMouse || 1) * repulse * 80;

    p.vx += ((tx + rx) - p.x) * 0.04;
    p.vy += ((ty + ry) - p.y) * 0.04;
    p.vx *= 0.88;
    p.vy *= 0.88;
    p.x += p.vx;
    p.y += p.vy;

    // draw
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color.replace(')', `,${p.opacity})`).replace('rgb', 'rgba');
    // fallback for hex colors
    ctx.globalAlpha = p.opacity;
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  // Connection lines between nearby particles
  ctx.lineWidth = 0.3;
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 90) {
        const a = (1 - d / 90) * 0.12;
        ctx.strokeStyle = `rgba(232,228,220,${a})`;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
