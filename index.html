<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Prisss">
<title>Prisss</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#06050a">
<meta name="msapplication-TileColor" content="#06050a">
<link rel="preload" as="font" type="font/ttf" href="/fonts/blade-runner-movie.ttf" crossorigin>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

@font-face {
  font-family: 'Blade Runner Movie';
  src: url('/fonts/blade-runner-movie.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

:root {
  --bg:         #06050a;
  --warm:       #ddd5c2;
  --warm-dim:   #6b6055;
  --warm-faint: #28231d;
  --groove:     #c4aa7e;
  --needle:     #ede4d0;
  --copper:     #c97a3a;
  --font-hero:  'Blade Runner Movie', ui-monospace, monospace;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
html, body {
  width:100%; height:100%; overflow:hidden;
  background: var(--bg);
  color: var(--warm);
  cursor: none;
}

canvas {
  position:fixed; inset:0; z-index:0; display:block;
  pointer-events:none;
}

.cur-dot {
  position:fixed; width:6px; height:6px;
  background: var(--needle);
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none; z-index:9999;
  mix-blend-mode:screen;
}
.cur-ring {
  position:fixed; width:34px; height:34px;
  border:1px solid rgba(196,170,126,0.35);
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none; z-index:9998;
  transition: width .2s ease, height .2s ease, border-color .2s ease;
}
.cur-ring.big { width:58px; height:58px; border-color:rgba(201,122,58,0.25); }

.vignette {
  position:fixed; inset:0; z-index:3; pointer-events:none;
  background: radial-gradient(ellipse 75% 75% at 50% 50%,
    transparent 28%, rgba(6,5,10,0.72) 100%);
}
.scanlines {
  position:fixed; inset:0; z-index:4; pointer-events:none;
  background: repeating-linear-gradient(
    to bottom, transparent, transparent 2px,
    rgba(0,0,0,0.035) 2px, rgba(0,0,0,0.035) 3px
  );
}
.grain {
  position:fixed; z-index:5; pointer-events:none;
  inset:-150%; width:400%; height:400%;
  opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  animation: grain .45s steps(1) infinite;
}
@keyframes grain {
  0%   { transform:translate(0,0); }
  20%  { transform:translate(-3%,-5%); }
  40%  { transform:translate(5%, 2%); }
  60%  { transform:translate(-2%, 6%); }
  80%  { transform:translate(4%,-3%); }
  100% { transform:translate(0,0); }
}

.shell {
  position:fixed; inset:0; z-index:10;
  display:grid;
  grid-template-columns: 1fr auto 1fr;
  grid-template-rows:    1fr auto 1fr;
  padding: clamp(24px,5vh,56px) clamp(28px,5vw,72px);
  pointer-events:none;
  animation: rise 1.1s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rise {
  from { transform:translateY(10px); }
  to   { transform:translateY(0); }
}

.corner-bl { grid-column:1; grid-row:3; align-self:end; justify-self:start; z-index:12; }
.corner-br { grid-column:3; grid-row:3; align-self:end; justify-self:end; text-align:right; z-index:12; }
.center    { grid-column:2; grid-row:2; align-self:center; justify-self:center; text-align:center; }

.nav {
  display:flex; flex-direction:column; gap:10px;
  pointer-events:all;
}
.corner-br .nav { align-items:flex-end; }

.nav-link {
  font-family: var(--font-hero);
  font-weight: normal;
  font-size: clamp(14px, 2.8vw, 22px);
  letter-spacing: .1em;
  color: var(--warm-dim);
  text-decoration: none;
  position: relative;
  padding-bottom: 9px;
  transition: color .2s;
}
.nav-link::after {
  content:'';
  position:absolute; bottom:0; left:0;
  height:1px; width:0;
  background: var(--groove);
  transition: width .5s cubic-bezier(.22,1,.36,1);
}
.corner-br .nav-link::after { left:auto; right:0; }
.nav-link:hover { color: var(--needle); }
.nav-link:hover::after { width:100%; }

.title {
  font-family: var(--font-hero);
  font-weight: normal;
  font-size: clamp(48px, 12vw, 140px);
  line-height: .95;
  letter-spacing: .06em;
  color: var(--warm);
  user-select: none;
  position: relative;
  display: inline-block;
  contain: layout style;
}
.title::before, .title::after {
  content:attr(data-text);
  position:absolute; inset:0; pointer-events:none;
  font-family:inherit;
  font-weight:inherit;
  letter-spacing:inherit;
  line-height:inherit;
}
.title::before {
  color:var(--copper);
  animation: g1 7s infinite step-start;
  clip-path:polygon(0 0,0 0,0 0,0 0);
}
.title::after {
  color:var(--warm-dim);
  animation: g2 7s infinite step-start;
  clip-path:polygon(0 0,0 0,0 0,0 0);
}
@keyframes g1 {
  0%,88%,100% { clip-path:polygon(0 0,0 0,0 0,0 0); transform:translate(0); }
  89% { clip-path:polygon(0 20%,100% 20%,100% 42%,0 42%); transform:translate(-4px,1px); opacity:.85; }
  90% { clip-path:polygon(0 58%,100% 58%,100% 72%,0 72%); transform:translate(3px,0);  opacity:.6; }
  91% { clip-path:polygon(0 0,0 0,0 0,0 0); }
}
@keyframes g2 {
  0%,90%,100% { clip-path:polygon(0 0,0 0,0 0,0 0); transform:translate(0); }
  91% { clip-path:polygon(0 35%,100% 35%,100% 55%,0 55%); transform:translate(5px,-1px); opacity:.45; }
  92% { clip-path:polygon(0 0,0 0,0 0,0 0); }
}

@media (max-width: 768px) {
  .shell {
    display: block;
    padding: 0;
  }

  .center {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 11;
    width: max-content;
    text-align: center;
  }

  .corner-bl,
  .corner-br {
    position: fixed;
    bottom: clamp(20px, 5vh, 36px);
    z-index: 12;
  }

  .corner-bl { left: clamp(16px, 4vw, 24px); }
  .corner-br {
    right: clamp(16px, 4vw, 24px);
    text-align: right;
  }

  .title {
    letter-spacing: .04em;
    margin-right: -.04em;
  }

  .nav-link {
    white-space: nowrap;
    font-size: clamp(11px, 3.2vw, 16px);
    letter-spacing: .08em;
  }
}

.site-audio {
  position: fixed;
  width: 0;
  height: 0;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  z-index: -1;
}

@media (hover: none) and (pointer: coarse) {
  html, body { cursor: auto; }
  .cur-dot, .cur-ring { display: none !important; }
}
</style>
</head>
<body data-page="home">

<div class="vignette"></div>
<div class="scanlines"></div>
<div class="grain"></div>
<div class="cur-dot" id="cDot"></div>
<div class="cur-ring" id="cRing"></div>

<div class="shell">
  <div class="center">
    <h1 class="title" data-text="Prisss" id="lcp-title">Prisss</h1>
  </div>

  <nav class="corner-bl nav" aria-label="Links">
    <a href="/mixes.html" class="nav-link">mixes</a>
    <a href="/bookings.html" class="nav-link">bookings</a>
  </nav>

  <nav class="corner-br nav" aria-label="Links">
    <a href="/dj-sets.html" class="nav-link">dj&nbsp;sets</a>
    <a href="http://gluerecords.club" target="_blank" rel="noopener noreferrer" class="nav-link">label</a>
  </nav>
</div>

<audio
  id="site-audio"
  class="site-audio"
  src="/audio/end-of-part-iii-intermedium.mp3"
  preload="auto"
  autoplay
  loop
  aria-hidden="true"
  tabindex="-1"
></audio>

<script src="js/audio.js" defer></script>
<script src="js/nav.js" defer></script>
<script src="js/visuals.js" defer></script>
</body>
</html>
