<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Prisss — Selector. Live sets. Performer. Patterns inside groove.">
<title>Prisss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Share+Tech+Mono&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Share+Tech+Mono&display=swap"></noscript>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:         #06050a;
  --warm:       #ddd5c2;
  --warm-dim:   #6b6055;
  --warm-faint: #28231d;
  --groove:     #c4aa7e;
  --needle:     #ede4d0;
  --copper:     #c97a3a;
  --font-serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --font-mono:  'Share Tech Mono', ui-monospace, 'Cascadia Mono', monospace;
}

canvas { opacity: 0; transition: opacity 0.35s ease; }
body.visuals-ready canvas { opacity: 1; }
body.visuals-static canvas { opacity: 0.35; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
html, body {
  width:100%; height:100%; overflow:hidden;
  background: var(--bg);
  color: var(--warm);
  cursor: none;
}

canvas { position:fixed; inset:0; z-index:0; display:block; }

/* ── Cursor ─────────────────────────────────────────────────────── */
.cur-dot {
  position:fixed; width:6px; height:6px;
  background: var(--needle);
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none; z-index:9999;
  mix-blend-mode:screen;
}
.cur-ring {
  position:fixed; width:34px; height:34px;
  border:1px solid rgba(196,170,126,0.35);
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none; z-index:9998;
  transition: width .2s ease, height .2s ease, border-color .2s ease;
}
.cur-ring.big { width:58px; height:58px; border-color:rgba(201,122,58,0.25); }

/* ── Post-processing layers ─────────────────────────────────────── */
.vignette {
  position:fixed; inset:0; z-index:3; pointer-events:none;
  background: radial-gradient(ellipse 75% 75% at 50% 50%,
    transparent 28%, rgba(6,5,10,0.72) 100%);
}
.scanlines {
  position:fixed; inset:0; z-index:4; pointer-events:none;
  background: repeating-linear-gradient(
    to bottom, transparent, transparent 2px,
    rgba(0,0,0,0.035) 2px, rgba(0,0,0,0.035) 3px
  );
}
.grain {
  position:fixed; z-index:5; pointer-events:none;
  inset:-150%; width:400%; height:400%;
  opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  animation: grain .45s steps(1) infinite;
}
@keyframes grain {
  0%   { transform:translate(0,0); }
  20%  { transform:translate(-3%,-5%); }
  40%  { transform:translate(5%, 2%); }
  60%  { transform:translate(-2%, 6%); }
  80%  { transform:translate(4%,-3%); }
  100% { transform:translate(0,0); }
}

/* ── Layout ─────────────────────────────────────────────────────── */
.shell {
  position:fixed; inset:0; z-index:10;
  display:grid;
  grid-template-columns: 1fr auto 1fr;
  grid-template-rows:    1fr auto 1fr;
  padding: clamp(24px,5vh,56px) clamp(28px,5vw,72px);
  pointer-events:none;
  animation: rise 2.6s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rise {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}

.corner-tl { grid-column:1; grid-row:1; align-self:start; justify-self:start; }
.corner-tr { grid-column:3; grid-row:1; align-self:start; justify-self:end; text-align:right; }
.corner-bl { grid-column:1; grid-row:3; align-self:end;   justify-self:start; }
.corner-br { grid-column:3; grid-row:3; align-self:end;   justify-self:end;   text-align:right; }
.center    { grid-column:2; grid-row:2; align-self:center; justify-self:center; text-align:center; }

/* ── Meta ───────────────────────────────────────────────────────── */
.meta {
  font-family: var(--font-mono);
  font-size: clamp(11px, 1.1vw, 13px);
  letter-spacing:.18em;
  line-height:2;
  color: var(--warm-dim);
  text-transform:uppercase;
}
.pulse {
  display:inline-block; width:5px; height:5px;
  border-radius:50%; background:var(--copper);
  margin-right:7px; vertical-align:middle;
  animation: throb 2.6s ease-in-out infinite;
}
@keyframes throb {
  0%,100% { opacity:1; transform:scale(1); }
  50%     { opacity:.25; transform:scale(.65); }
}

/* ── Platform links ─────────────────────────────────────────────── */
.links { display:flex; flex-direction:column; gap:20px; pointer-events:all; }
.link  { text-decoration:none; display:flex; flex-direction:column; gap:4px;
         position:relative; padding-bottom:9px; }
.link::after {
  content:''; position:absolute; bottom:0; left:0;
  height:1px; width:0;
  background: var(--groove);
  transition: width .5s cubic-bezier(.22,1,.36,1);
}
.link:hover::after  { width:100%; }
.link:hover .l-name { color:var(--needle); }
.link:hover .l-plat { color:var(--copper); }
.l-plat {
  font-family:var(--font-mono);
  font-size:clamp(11px, 2.4vw, 13px);
  letter-spacing:.22em; color:var(--warm-faint);
  text-transform:uppercase; transition:color .2s;
}
.l-name {
  font-family:var(--font-serif); font-weight:300; font-style:italic;
  font-size:clamp(20px, 4.2vw, 26px); letter-spacing:.05em;
  color:var(--warm-dim); transition:color .25s;
}

/* ── Centre ─────────────────────────────────────────────────────── */
.eyebrow {
  display:block;
  font-family:var(--font-mono);
  font-size:clamp(11px, 2.2vw, 14px);
  letter-spacing:.32em; color:var(--warm-faint);
  text-transform:uppercase;
  margin-bottom:clamp(14px,2.8vh,34px);
}

.title {
  font-family:var(--font-serif); font-weight:300;
  font-size: clamp(72px, 18vw, 220px);
  line-height:.88; letter-spacing:-.02em;
  color:var(--warm); user-select:none;
  position:relative; display:inline-block;
}
.title::before, .title::after {
  content:attr(data-text);
  position:absolute; inset:0; pointer-events:none;
}
.title::before {
  color:var(--copper);
  animation: g1 7s infinite step-start;
  clip-path:polygon(0 0,0 0,0 0,0 0);
}
.title::after {
  color:var(--warm-dim);
  animation: g2 7s infinite step-start;
  clip-path:polygon(0 0,0 0,0 0,0 0);
}
@keyframes g1 {
  0%,88%,100% { clip-path:polygon(0 0,0 0,0 0,0 0); transform:translate(0); }
  89% { clip-path:polygon(0 20%,100% 20%,100% 42%,0 42%); transform:translate(-4px,1px); opacity:.85; }
  90% { clip-path:polygon(0 58%,100% 58%,100% 72%,0 72%); transform:translate(3px,0);  opacity:.6; }
  91% { clip-path:polygon(0 0,0 0,0 0,0 0); }
}
@keyframes g2 {
  0%,90%,100% { clip-path:polygon(0 0,0 0,0 0,0 0); transform:translate(0); }
  91% { clip-path:polygon(0 35%,100% 35%,100% 55%,0 55%); transform:translate(5px,-1px); opacity:.45; }
  92% { clip-path:polygon(0 0,0 0,0 0,0 0); }
}

.rule {
  display:block; width:1px;
  height:clamp(22px,3.5vh,44px);
  background:linear-gradient(to bottom, transparent, var(--warm-faint), transparent);
  margin:clamp(14px,2.2vh,26px) auto;
}
.tagline {
  font-family:var(--font-serif); font-style:italic; font-weight:300;
  font-size:clamp(15px, 3.2vw, 20px); letter-spacing:.14em; color:var(--warm-dim);
}
.meta-foot {
  font-size: clamp(10px, 1vw, 12px);
  letter-spacing: .12em;
}

/* ── Mobile & touch ─────────────────────────────────────────────── */
@media (max-width: 900px) {
  html, body {
    overflow-x: hidden;
    overflow-y: auto;
    min-height: 100dvh;
    height: auto;
    cursor: auto;
  }

  .cur-dot, .cur-ring { display: none !important; }

  .shell {
    position: relative;
    min-height: 100dvh;
    height: auto;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    gap: clamp(28px, 6vw, 40px);
    padding: clamp(20px, 5vw, 32px) clamp(18px, 4vw, 28px);
    padding-bottom: max(28px, env(safe-area-inset-bottom));
    pointer-events: auto;
  }

  .corner-tl, .corner-tr, .corner-bl, .corner-br, .center {
    grid-column: unset;
    grid-row: unset;
    align-self: stretch;
    justify-self: stretch;
  }

  .corner-tl { order: 1; text-align: center; }
  .corner-tr { order: 2; text-align: center; }
  .center    { order: 0; text-align: center; padding: 8px 0; }
  .corner-bl { order: 3; }
  .corner-br { order: 4; text-align: center; }

  .meta {
    font-size: clamp(12px, 3.2vw, 14px);
    letter-spacing: .14em;
    line-height: 1.85;
  }

  .title {
    font-size: clamp(56px, 20vw, 100px);
    line-height: .9;
  }

  .eyebrow {
    font-size: clamp(12px, 3vw, 14px);
    letter-spacing: .26em;
    margin-bottom: 12px;
  }

  .tagline {
    font-size: clamp(16px, 4vw, 20px);
    letter-spacing: .12em;
  }

  .links {
    align-items: center;
    gap: 24px;
  }

  .link {
    align-items: center;
    text-align: center;
    min-height: 48px;
    padding: 10px 8px 14px;
  }

  .l-plat { font-size: clamp(12px, 3vw, 14px); }
  .l-name { font-size: clamp(22px, 5.5vw, 28px); }

  .corner-br .meta-foot {
    font-size: clamp(11px, 2.8vw, 13px) !important;
  }
}

@media (max-width: 380px) {
  .title { font-size: clamp(48px, 18vw, 72px); }
  .meta { letter-spacing: .1em; }
}

@media (hover: none) and (pointer: coarse) {
  html, body { cursor: auto; }
  .cur-dot, .cur-ring { display: none !important; }
}

@media (max-width: 900px) {
  .grain { animation: none; opacity: 0.02; }
}

@media (prefers-reduced-motion: reduce) {
  .grain, .scanlines { animation: none !important; }
  .title::before, .title::after, .pulse, .instruction { animation: none !important; }
  .shell { animation: none; }
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>
<div class="grain"></div>
<div class="cur-dot" id="cDot"></div>
<div class="cur-ring" id="cRing"></div>

<div class="shell">
  <div class="corner-tl meta">
    <span><span class="pulse"></span>Active</span><br>
    Techno · Electronics<br>
    Barcelona — Brighton
  </div>
  <div class="corner-tr meta">
    Selector<br>Live Sets<br>Performer
  </div>

  <div class="center">
    <span class="eyebrow">Infinite pattern</span>
    <h1 class="title" data-text="Prisss">Prisss</h1>
    <span class="rule"></span>
    <span class="tagline">inside the groove</span>
  </div>

  <div class="corner-bl">
    <nav class="links" aria-label="Platforms">
      <a href="https://hearthis.at/prisss/" target="_blank" rel="noopener noreferrer" class="link">
        <span class="l-plat">Hearthis.at</span>
        <span class="l-name">Listen</span>
      </a>
      <a href="https://mixcloud.com/prisss" target="_blank" rel="noopener noreferrer" class="link">
        <span class="l-plat">Mixcloud</span>
        <span class="l-name">Mixes</span>
      </a>
    </nav>
  </div>
  <div class="corner-br meta">
    <span style="color:var(--warm-faint)">Move to interact</span><br>
    <span class="meta-foot" style="color:var(--warm-faint)">© 2025 Prisss</span>
  </div>
</div>

<script src="js/visuals.js" defer></script>
</body>
</html>
