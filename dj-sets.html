<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>DJ Sets — Prisss</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

@font-face {
  font-family: 'Blade Runner Movie';
  src: url('/fonts/blade-runner-movie.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

:root {
  --bg: #06050a;
  --warm: #ddd5c2;
  --warm-dim: #6b6055;
  --groove: #c4aa7e;
  --needle: #ede4d0;
  --font-hero: 'Blade Runner Movie', ui-monospace, monospace;
}

html, body {
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--warm);
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
}

.panel {
  max-width: 360px;
}

h1 {
  font-family: var(--font-hero);
  font-size: clamp(18px, 5vw, 28px);
  font-weight: normal;
  letter-spacing: .12em;
  color: var(--warm);
  margin-bottom: 14px;
}

p {
  font-family: var(--font-hero);
  font-size: clamp(11px, 3vw, 14px);
  letter-spacing: .08em;
  color: var(--warm-dim);
  line-height: 1.6;
  margin-bottom: 28px;
}

.btn {
  display: inline-block;
  font-family: var(--font-hero);
  font-size: clamp(12px, 3.4vw, 16px);
  letter-spacing: .1em;
  color: var(--needle);
  text-decoration: none;
  border: 1px solid var(--groove);
  padding: 14px 22px;
  transition: color .2s, border-color .2s;
}

.btn:hover { color: var(--groove); border-color: var(--needle); }

.back {
  display: block;
  margin-top: 24px;
  font-family: var(--font-hero);
  font-size: 11px;
  letter-spacing: .1em;
  color: var(--warm-dim);
  text-decoration: none;
}

.back:hover { color: var(--warm); }

.site-audio {
  position: fixed;
  width: 0;
  height: 0;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  z-index: -1;
}
</style>
</head>
<body>
<div class="panel">
  <h1>DJ SETS</h1>
  <p>Opens in your browser — no app required.</p>
  <a href="https://hearthis.at/prisss/" class="btn" id="open">open hearthis.at</a>
  <a href="/" class="back">← prisss</a>
</div>
<script>
(function () {
  var url = 'https://hearthis.at/prisss/';
  var btn = document.getElementById('open');

  function openInBrowser(e) {
    if (e) e.preventDefault();

    if (/Android/i.test(navigator.userAgent)) {
      window.location.href =
        'intent://hearthis.at/prisss/#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;S.browser_fallback_url=' +
        encodeURIComponent(url) + ';end';
      return;
    }

    window.location.assign(url);
  }

  btn.addEventListener('click', openInBrowser);
})();
</script>

<audio
  id="site-audio"
  class="site-audio"
  src="/audio/end-of-part-iii-intermedium.mp3"
  preload="auto"
  autoplay
  loop
  aria-hidden="true"
  tabindex="-1"
></audio>
<script src="/js/audio.js" defer></script>
</body>
</html>
